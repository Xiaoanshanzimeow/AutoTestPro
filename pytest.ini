[pytest]
addopts= --reruns 2 --reruns-delay 1 -n auto --dist=loadscope
;失败后重试2次，每次重试之间等待1秒,按 CPU 核数自动起 N 个 pytest 进程，用例分发到不同进程并行跑。放在 addopts 里就是"默认就并行"。
;testpaths=./testcase

filterwarnings=
    error
    ignore::UserWarning

python_files=test_*.py

python_classes=Test*

python_functions=test

;  这体现的是关注点分离：把「和业务无关的框架通用逻辑」（清理环境、结果通知）放根 conftest，把「业务相关的前置」放子目录
;  conftest。这样以后要是加一个 testcase_web/ 目录，它能自动复用根 conftest 的清理 + 通知，只要在自己目录写一个 web
;  专属的登录 fixture 就行——这是 pytest conftest 分层机制带来的可扩展性。